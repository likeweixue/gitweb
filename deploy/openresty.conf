# =============================================================
# Gitweb — OpenResty / nginx 站点配置示例
#
# 放置位置（按实际环境调整）：
#   OpenResty: /usr/local/openresty/nginx/conf/conf.d/gitweb.conf
#   nginx:     /etc/nginx/conf.d/gitweb.conf
#
# 前提：
#   - PHP-FPM 已安装，监听 unix:/tmp/php-cgi-gitweb.sock（或改为 127.0.0.1:9000）
#   - 站点根目录指向 public/（仓库数据在 storage/repositories，绝不可暴露）
#   - php-fpm 运行用户的 PATH 中包含 git（一般 /usr/bin/git 即可）
# =============================================================

server {
    listen 443 ssl http2;
    server_name gitweb.example.com;

    # ---------- SSL 证书（按实际路径修改） ----------
    ssl_certificate     /www/sites/gitweb.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/gitweb.example.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ---------- 站点根目录 ----------
    root /www/sites/gitweb.example.com/public;
    index index.php;

    # ---------- Git 推送相关 ----------
    client_max_body_size 512m;        # 允许大仓库推送
    fastcgi_read_timeout 300;         # clone/push 长连接
    fastcgi_send_timeout 300;
    fastcgi_buffering off;            # 流式转发 pack 数据

    # ---------- 日志 ----------
    access_log /www/sites/gitweb.example.com/storage/logs/access.log;
    error_log  /www/sites/gitweb.example.com/storage/logs/error.log warn;

    # ---------- 安全防护（双保险，public/ 之外本不可达） ----------
    location ~ /\.(?!well-known) {
        deny all;
    }
    location = /config.php {
        deny all;
    }
    location ~ ^/(app|storage|bin|views|deploy)/ {
        deny all;
    }
    location ~* \.(sql|md|log|lock)$ {
        deny all;
    }

    # ---------- 前端控制器 ----------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---------- PHP-FPM ----------
    location ~ [^/]\.php(/|$) {
        fastcgi_pass unix:/tmp/php-cgi-gitweb.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # git http-backend 需要完整请求体（大推送时分块由 nginx 合并）
        fastcgi_request_buffering on;
        fastcgi_max_temp_file_size 0;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}

# ---------- HTTP 跳转 HTTPS ----------
server {
    listen 80;
    server_name gitweb.example.com;
    return 301 https://$host$request_uri;
}
